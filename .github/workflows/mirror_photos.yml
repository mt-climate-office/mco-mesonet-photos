name: Mirror Mesonet Photos

on:
  schedule:
    - cron: "0 15 * * *"    # 9:00 AM MDT (UTC-6)
    - cron: "15 15 * * *"   # 9:15 AM MDT (UTC-6)
    - cron: "30 15 * * *"   # 9:30 AM MDT (UTC-6)
    - cron: "45 15 * * *"   # 9:45 AM MDT (UTC-6)
    - cron: "0 16 * * *"    # 10:00 AM MDT (UTC-6)
    - cron: "0 17 * * *"    # 11:00 AM MDT (UTC-6)
    - cron: "0 21 * * *"    # 3:00 PM MDT (UTC-6)
    - cron: "15 21 * * *"   # 3:15 PM MDT (UTC-6)
    - cron: "30 21 * * *"   # 3:30 PM MDT (UTC-6)
    - cron: "45 21 * * *"   # 3:45 PM MDT (UTC-6)
    - cron: "0 22 * * *"    # 4:00 PM MDT (UTC-6)
    - cron: "0 23 * * *"    # 5:00 PM MDT (UTC-6)
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install cwebp
        run: sudo apt-get install -y webp

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Mirror photos
        run: python scripts/mirror_photos.py

      - name: Invalidate CloudFront manifest cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/photos/manifest.parquet"

  preview:
    name: Update social preview image
    needs: mirror
    # The mirror job runs many times a day, but the social preview only needs
    # refreshing once daily.  Run it after the last mirror of the day (5:00 PM
    # local — "0 23" in MDT / "0 0" in MST, both forms listed so the DST
    # adjuster doesn't need to touch this line), or on manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 23 * * *' ||
      github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit docs/preview.png back to the repo

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Generate preview image
        run: python scripts/generate_preview.py

      - name: Commit preview image
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # preview.png is a regenerated, non-deterministic binary, so it can't
          # be git-merged.  Instead of rebasing our commit onto origin/main
          # (which produces an unresolvable binary conflict whenever origin has
          # also updated the file), we always reset to the latest origin/main
          # and re-apply our freshly generated file on top.  Retry if origin
          # moves under us between fetch and push.
          cp docs/preview.png "$RUNNER_TEMP/preview.png"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/preview.png" docs/preview.png
            git add docs/preview.png

            if git diff --staged --quiet; then
              echo "Preview unchanged from origin/main; nothing to commit."
              exit 0
            fi

            git commit -m "chore: update social preview image [skip ci]"

            if git push; then
              echo "Pushed preview update on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (attempt $attempt); origin/main moved, retrying…"
            sleep 5
          done

          echo "Failed to push preview after 5 attempts." >&2
          exit 1
